# Publishing server.json to the Official MCP Registry.
#
# release.yml publishes the npm tarball when a v* tag is pushed. This workflow
# publishes the metadata the registry (and PulseMCP, which reads it) actually
# lists. It does not run `npm publish`: the registry fetches the tarball that
# is already there and checks that its package.json mcpName equals the name
# in server.json. A second publish of the same npm version would fail.
#
# `id-token: write` is what `mcp-publisher login github-oidc` exchanges for a
# registry token. GitHub auth can only publish a name under
# io.github.Lobstack-ai/, which is why server.json name and package.json
# mcpName are both io.github.Lobstack-ai/lobstack-mcp. No registry secret.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A release event checks out the default branch, not the tag the release
      # was cut from. Publish the commit the release names.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'

      # The tag, package.json, and server.json are three claims about one
      # version. The registry rejects a mismatch, and it rejects it after the
      # auth round-trip, so check it here where the log says which field moved.
      - name: server.json must match package.json
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const server = JSON.parse(readFileSync("server.json", "utf8"));
          const expectedName = "io.github.Lobstack-ai/lobstack-mcp";
          const problems = [];

          if (pkg.mcpName !== expectedName) {
            problems.push(`package.json mcpName is ${JSON.stringify(pkg.mcpName)}, expected ${expectedName}`);
          }
          if (server.name !== expectedName) {
            problems.push(`server.json name is ${JSON.stringify(server.name)}, expected ${expectedName}`);
          }
          if (server.name !== pkg.mcpName) {
            problems.push("server.json name and package.json mcpName differ");
          }
          if (server.description !== pkg.description) {
            problems.push("server.json description and package.json description differ");
          }
          if (server.version !== pkg.version) {
            problems.push(`server.json version ${server.version} != package.json ${pkg.version}`);
          }

          const entry = (server.packages || []).find((p) => p.identifier === pkg.name);
          if (!entry) {
            problems.push(`server.json has no package ${pkg.name}`);
          } else {
            if (entry.registryType !== "npm") problems.push(`registryType is ${entry.registryType}, expected npm`);
            if (entry.registryBaseUrl !== "https://registry.npmjs.org") {
              problems.push(`registryBaseUrl is ${entry.registryBaseUrl}, expected https://registry.npmjs.org`);
            }
            if (entry.version !== pkg.version) {
              problems.push(`package entry version ${entry.version} != package.json ${pkg.version}`);
            }
            if (entry.transport?.type !== "stdio") problems.push("transport must be stdio");
            if (entry.runtimeHint !== "npx") problems.push(`runtimeHint is ${entry.runtimeHint}, expected npx`);
            const key = (entry.environmentVariables || []).find((v) => v.name === "LOBSTACK_API_KEY");
            if (!key) problems.push("LOBSTACK_API_KEY is not declared");
            else if (key.isRequired !== false || key.isSecret !== true) {
              problems.push("LOBSTACK_API_KEY must be optional (isRequired: false) and secret (isSecret: true)");
            }
          }

          if (problems.length) {
            console.error(problems.join("\n"));
            process.exit(1);
          }
          console.log(`${server.name} ${server.version} matches ${pkg.name}`);
          EOF

      # release.yml and this workflow start together when a release is
      # published from a tag that was just pushed. The registry cannot see a
      # tarball that is not on npm yet.
      - name: Wait until this version is on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Looking for @lobstack-ai/mcp@${version}"
          for i in $(seq 1 30); do
            if npm view "@lobstack-ai/mcp@${version}" version >/dev/null 2>&1; then
              echo "@lobstack-ai/mcp@${version} is on npm"
              exit 0
            fi
            echo "not on npm yet (${i}/30); release.yml publishes it from the tag"
            sleep 10
          done
          echo "@lobstack-ai/mcp@${version} is not on npm." >&2
          echo "Push the v${version} tag first so release.yml publishes the tarball." >&2
          exit 1

      # The registry does not read this checkout's package.json. It reads the
      # one inside the published tarball. 0.1.3 went out before mcpName
      # existed, and npm will not replace that tarball.
      - name: Published tarball must carry mcpName
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="io.github.Lobstack-ai/lobstack-mcp"
          published="$(npm view "@lobstack-ai/mcp@${version}" mcpName)"
          if [ "$published" != "$expected" ]; then
            echo "npm @lobstack-ai/mcp@${version} mcpName is '${published}', expected ${expected}." >&2
            echo "Ship a new version. The registry checks the tarball, and this version cannot be republished." >&2
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
